default_install_hook_types: ["pre-commit"]
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: ruff format
        language: system
        types: [python]
      - id: max-lines
        name: max 600 lines
        entry: >-
          python -c "import sys; bad = [f'{p}: {n} lines (max 600)' for p in sys.argv[1:] if (n := sum(1 for _ in open(p, 'rb'))) > 600]; print(*bad, sep=chr(10)); sys.exit(bool(bad))"
        language: system
        types: [python]
        exclude: ^tests/
      - id: no-content-files
        name: no documents, images or content data
        entry: >-
          python -c "import sys; print('Content files must not be committed:', *sys.argv[1:], sep=chr(10)); sys.exit(1)"
        language: system
        files: (?i)\.(pdf|png|jpe?g|gif|webp|docx?|xlsx?|pptx?|csv|json|sql|txt|db|sqlite3?)$

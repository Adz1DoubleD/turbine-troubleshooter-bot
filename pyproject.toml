[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turbine-troubleshooter-bot"
version = "2.0.2"
description = "Telegram bot for wind turbine technicians: fault codes, spare parts and reference content behind approval-based access."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Adz1DoubleD" }]
keywords = ["telegram", "bot", "wind turbine", "troubleshooting", "maintenance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "python-telegram-bot>=22,<23",
    "aiomysql[rsa]>=0.3,<0.4",
    "sentry-sdk>=2,<3",
    "aiohttp>=3.9,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "freezegun==1.5.5",
    "ruff==0.17.5",
    "pre_commit==4.7.0",
]

[project.urls]
Homepage = "https://github.com/Adz1DoubleD/turbine-troubleshooter-bot"
Issues = "https://github.com/Adz1DoubleD/turbine-troubleshooter-bot/issues"
Changelog = "https://github.com/Adz1DoubleD/turbine-troubleshooter-bot/releases"

[tool.setuptools.packages.find]
include = ["turbine_troubleshooter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

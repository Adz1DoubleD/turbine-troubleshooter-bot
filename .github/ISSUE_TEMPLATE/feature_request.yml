name: Feature request
description: Suggest something new or a change to how the bot works
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The problem or task, from a technician's or admin's point of view.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you'd like it to work.
    validations:
      required: true
